<html>
  <head>
    <link rel="stylesheet" href="speed.css">
            
    <title>JontesDash</title>

    <script src="./jquery-3.5.1.min.js"></script>
    <!-- <script src="window.js"></script> -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" >
  </head>
  <body>


<div class="container" id="container">



      <!-- PAGE 1: new page on the LEFT -->
      <div class="page">
        <div>
          <!-- <h1>Left Page</h1> -->
          <!-- <p>Swipe right → to go to the Speedometer</p> -->
            <div id="kamera" ">
              <video id="video" width="100%" autoplay style="transform: scale(-1,1);"></video >
              <canvas id="canvas"></canvas> 
            </div>                    
        </div>
      </div>

      <!-- PAGE 2:  speedometer -->
  <div class="page">


        <link href="https://fonts.googleapis.com/css?family=Oswald" rel="stylesheet">
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.4.0/css/font-awesome.min.css">

        <div id="kmh">xx</div>

        <div id="clock">XX:XX</div>

        <div id="temp">°c</div>


        <div class="speedbox">
          <canvas id="speedbox-score" class="speedbox__score"></canvas>
        
          <img id="stadjanImg"  src="stadjan.jpg" alt="städjan" class="background" >
          <video id="stadjanCam" class="background_video" autoplay playsinline ></video>
          <div id="stadjanHit" class="background" style="background:transparent; z-index:200; cursor:pointer;">            
          </div>

            <div class="fart">

              <p class="numbers" style="margin-top: -22%; margin-left: 153%;">140</p>
              <p class="numbers" style="margin-top: -65%; margin-left: 167%;">130</p>
              <p class="numbers" style="margin-top: -110%; margin-left: 165%;">120</p>
              <p class="numbers" style="margin-top: -152%; margin-left: 157%;">110</p>
              <p class="numbers" style="margin-top: -183%; margin-left: 127%;">100</p>
              <p class="numbers" style="margin-top: -205%; margin-left: 100%;">90</p>
              <p class="numbers" style="margin-top: -220%; margin-left: 60%;">80</p>
              <p class="numbers" style="margin-top: -220%; margin-left: 17%;">70</p>
              <p class="numbers" style="margin-top: -203%; margin-left: -25%;">60</p>
              <p class="numbers" style="margin-top: -180%; margin-left: -56%;">50</p>
              <p class="numbers" style="margin-top: -145%; margin-left: -80%;">40</p>
              <p class="numbers" style="margin-top: -107%; margin-left: -94%;">30</p>
              <p class="numbers" style="margin-top: -65%; margin-left: -95%;">20</p>
              <p class="numbers" style="margin-top: -30%; margin-left: -80%;">10</p>
              <p class="numbers" style="margin-top: 18%; margin-left: -51%;">0</p>
              

            </div>

            <div class="cirkles">

                <div class="centerCircle">

                  <div id="leftBlinker">
                    <svg class="arrows" viewBox="-10 -10 80 92" style="transform: rotate(90deg);">
                      <path class="a1" d="M0 0 L30 32 L60 0"></path>
                      <path class="a2" d="M0 20 L30 52 L60 20"></path>
                      <path class="a3" d="M0 40 L30 72 L60 40"></path>
                    </svg>
                  </div>

                  <div id="rightBlinker">
                    <svg class="arrows" viewBox="-10 -10 80 92" style="transform: rotate(-90deg);">
                      <path class="a1" d="M0 0 L30 32 L60 0"></path>
                      <path class="a2" d="M0 20 L30 52 L60 20"></path>
                      <path class="a3" d="M0 40 L30 72 L60 40"></path>
                    </svg>
                  </div>
                  
                </div>

                <div class="leftCircle" > <!-- style="visibility: hidden;"> -->
                  <div id="fuelcapacity" style="margin-left: -15%; margin-top: 15%;">null</div>
                  <p style="margin-top: -15%; margin-right: 23%; font-size: small;">fuel</p>
                </div>

                <div class="rightCirkle" > <!-- style="visibility: hidden;"> -->
                </div>


            </div>


        </div>

        <div class="chart" id="graph1" data-percent="10">
          <div class="graphProcent" id="g1" style="left:93%">1%</div>
        </div>
        <div class="chart" id="graph2" data-percent="20">
          <div class="graphProcent" id="g2" style="top:56%;left:93%">2%</div>
        </div>
        <div class="chart" id="graph3" data-percent="30">
          <div class="graphProcent" id="g3" style="top:56%">3%</div>
        </div>
        <div class="chart" id="graph4" data-percent="40">
          <div class="graphProcent" id="g4">4%</div>
        </div>


        <div id="engineVoltage">Engine Volt%</div>
        <div id="livingVoltage">Camper Volt%</div>
        <div id="coolantTemp">Coolant temp°</div>
        <div id="dieselTank">Heater tank%</div>




<div class="info" id="info">
  <span class="icon">ⓘ</span>
  <div class="info-window">
    <span class="extra-info" id="errors"></span>
  </div>
</div>

<div class="altitudegraph">
  <canvas id="altitudeCanvas"></canvas>
  <div id="altitudeLabel"></div>
</div>




  </div>  <!--End of page 2-->

      <!-- PAGE 3: Example settings/info page -->
      <div class="page">

        <div class="firstColumn">
          
          <div class="floodLights">
            <h1 style="font-size: xx-large; color: aliceblue;">Flood Lights</h1>
            <!-- <button id="backBtn">Home</button> -->
          </div>
          
          <div class="roofSliders">

            <div class="slideBox">
              <div id="leftLight" class="sliderNumber">0</div>
              <input id="leftLightSlider" type="range" class="vertical-slider" min="0" max="100" value="0">
            </div>
            <div class="slideBox">
            <div id="centerLight" class="sliderNumber">0</div>
              <input id="centerLightSlider" type="range" class="vertical-slider" min="0" max="100" value="0">
            </div>
            <div class="slideBox">
            <div id="rightLight"  class="sliderNumber">0</div>
              <input id="rightLightSlider" type="range" class="vertical-slider" min="0" max="100" value="0">
            </div>

          </div>

        </div>


        <div class="secondColumn">        

        <div class="cabLights">
          <h1 style="font-size: xx-large; color: aliceblue;">Cab Lights</h1>  
        </div>

          <nav role="navigation">
            <div id="menuToggle">                  
              <ul id="menu">

                <div id="rgbController" >
                  <div id="sContainer">
                    <canvas id="circularSlider"  width="300" height="300" ></canvas>
                    <div id="sValue"></div> <!-- Value in circle -->
                  </div>
                </div>

              </ul>
            </div>
          </nav>

        <div class="rgbButtons">
          <button id="rgbButton1" class="rgbLight"></button>
          <button id="rgbButton2" class="rgbLight"></button>
          <button id="rgbButton3" class="rgbLight"></button>
        </div>
      </div>
          
        <div class="info" id="info2" style="visibility: hidden;">

          <span class="icon">ⓘ</span>

          <!-- expandable window -->
          <div class="info-window">
            <span class="extra-info" id="errors2"></span>
          </div>

        </div>
      

      </div>



</div>  <!-- end of container-->


        <script src="window.js"></script>
  </body>
</html>
