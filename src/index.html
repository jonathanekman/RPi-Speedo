<html>
  <head>
    <link rel="stylesheet" href="speed.css">
            
    <title>JontesDash</title>

    <script src="./jquery-3.5.1.min.js"></script>
    <!-- <script src="window.js"></script> -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" >
  </head>
  <body>


<div class="container" id="container">



      <!-- PAGE 1: new page on the LEFT -->
      <div class="page">
        <div>
          <!-- <h1>Left Page</h1> -->
          <!-- <p>Swipe right → to go to the Speedometer</p> -->
            <div id="kamera" ">
              <video id="video" width="100%" autoplay style="transform: scale(-1,1);"></video >
              <canvas id="canvas"></canvas>
            </div>
            <div class="kamPanBtn kamPanUp" id="kamPanUp">
              <svg viewBox="0 0 40 24" aria-hidden="true">
                <polyline points="4,20 20,4 36,20" />
              </svg>
            </div>
            <div class="kamPanBtn kamPanDown" id="kamPanDown">
              <svg viewBox="0 0 40 24" aria-hidden="true">
                <polyline points="4,4 20,20 36,4" />
              </svg>
            </div>
        </div>
      </div>

      <!-- CENTER COLUMN: page 2 (speedo) on top, page 4 below (vertical swipe) -->
      <div class="vColumn" id="vColumn">

      <!-- PAGE 2:  speedometer -->
  <div class="page">


        <link href="https://fonts.googleapis.com/css?family=Oswald" rel="stylesheet">
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.4.0/css/font-awesome.min.css">

        <div id="kmh">xx</div>

        <div id="clock">XX:XX</div>

        <div id="temp">--</div>
        <div id="tempUnit">°c</div>


        <div class="speedbox">
          <canvas id="speedbox-score" class="speedbox__score"></canvas>
        
          <img id="stadjanImg"  src="stadjan.jpg" alt="städjan" class="background" >
          <video id="stadjanCam" class="background_video" autoplay playsinline ></video>
          <div id="stadjanHit" class="background" style="background:transparent; z-index:200; cursor:pointer;">            
          </div>

            <div class="fart"></div>

            <div class="cirkles">

                <div class="centerCircle">

                  <div id="leftBlinker">
                    <svg class="arrows" viewBox="-10 -10 80 92" style="transform: rotate(90deg);">
                      <path class="a1" d="M0 0 L30 32 L60 0"></path>
                      <path class="a2" d="M0 20 L30 52 L60 20"></path>
                      <path class="a3" d="M0 40 L30 72 L60 40"></path>
                    </svg>
                  </div>

                  <div id="rightBlinker">
                    <svg class="arrows" viewBox="-10 -10 80 92" style="transform: rotate(-90deg);">
                      <path class="a1" d="M0 0 L30 32 L60 0"></path>
                      <path class="a2" d="M0 20 L30 52 L60 20"></path>
                      <path class="a3" d="M0 40 L30 72 L60 40"></path>
                    </svg>
                  </div>
                  
                </div>

                <div class="leftCircle" > <!-- style="visibility: hidden;"> -->
                  <div id="fuelcapacity" style="margin-left: -15%; margin-top: 15%;">null</div>
                  <p style="margin-top: -15%; margin-right: 23%; font-size: small;">fuel</p>
                </div>

                <div class="rightCirkle" > <!-- style="visibility: hidden;"> -->
                </div>


            </div>


        </div>

        <div class="chart" id="graph1" data-percent="10">
          <div id="dieselTank">Heater tank</div>
          <div class="graphProcent" id="g1" style="top:41%;left:106%">1%</div>
        </div>
        <div class="chart" id="graph2" data-percent="20">
          <div id="livingVoltage">Camper Volt</div>
          <div class="graphProcent" id="g2" style="top:69%;left:106%">2%</div>
        </div>
        <div class="chart" id="graph3" data-percent="30">
          <div id="engineVoltage">Engine Volt</div>
          <div class="graphProcent" id="g3" style="top:69%;left:-6%">3%</div>
        </div>
        <div class="chart" id="graph4" data-percent="40">
          <div id="coolantTemp">Coolant temp</div>
          <div class="graphProcent" id="g4" style="top:41%;left:-6%">4%</div>
        </div>




<div class="info" id="info">
  <span class="icon">ⓘ</span>
  <div class="info-window">
    <span class="extra-info" id="errors"></span>
  </div>
</div>




  </div>  <!--End of page 2-->

      <!-- PAGE 4: below page 2, reached by swiping down on the main page -->
      <div class="page" id="page4">
        <div class="page4Content">
          <div class="graphSelect" id="graphSelect">
            <button id="graphSelectBtn" type="button">Select graphs ▾</button>
            <div class="graphSelectPanel hidden" id="graphSelectPanel"></div>
          </div>
          <div class="graphStack" id="graphStack"></div>
        </div>
      </div>

      </div>  <!-- End of vColumn -->

      <!-- PAGE 3: Example settings/info page -->
      <div class="page" style="position: relative;">
        <button id="settingsBtn" style="
          position: absolute;
          top: 10px;
          right: 60px;
          z-index: 999;
          width: 40px;
          height: 40px;
          border-radius: 50%;
          border: none;
          background: rgba(120, 120, 120, 0.8);
          color: white;
          font-size: 20px;
          cursor: pointer;
          display: flex;
          align-items: center;
          justify-content: center;
        ">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="white">
            <path d="M19.14,12.94c0.04-0.31,0.06-0.63,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
          </svg>
        </button>

        <button id="exitBtn" onclick="window.api.quitApp()" style="
          position: absolute;
          top: 10px;
          right: 10px;
          z-index: 999;
          width: 40px;
          height: 40px;
          border-radius: 50%;
          border: none;
          background: rgba(255, 50, 50, 0.8);
          color: white;
          font-size: 20px;
          font-weight: bold;
          cursor: pointer;
        ">✕</button>

        <img id="roofQr" alt="" style="
          position: absolute;
          top: 60px;
          right: 10px;
          z-index: 999;
          width: 120px;
          height: 120px;
          background: white;
          padding: 6px;
          border-radius: 6px;
          display: none;
        ">

        <div class="firstColumn">
          
          <div class="floodLights">
            <h1 style="font-size: xx-large; color: aliceblue;">Flood Lights</h1>
            <!-- <button id="backBtn">Home</button> -->
          </div>
          
          <div class="roofSliders">

            <div class="slideBox">
              <div id="leftLight" class="sliderNumber">0</div>
              <input id="leftLightSlider" type="range" class="vertical-slider" min="0" max="100" value="0">
            </div>
            <div class="slideBox">
            <div id="centerLight" class="sliderNumber">0</div>
              <input id="centerLightSlider" type="range" class="vertical-slider" min="0" max="100" value="0">
            </div>
            <div class="slideBox">
            <div id="rightLight"  class="sliderNumber">0</div>
              <input id="rightLightSlider" type="range" class="vertical-slider" min="0" max="100" value="0">
            </div>

          </div>

        </div>


        <div class="secondColumn">        

        <div class="cabLights">
          <h1 style="font-size: xx-large; color: aliceblue;">Cab Lights</h1>  
        </div>

          <nav role="navigation">
            <div id="menuToggle">                  
              <ul id="menu">

                <div id="rgbController" >
                  <div id="sContainer">
                    <canvas id="circularSlider"  width="300" height="300" ></canvas>
                    <div id="sValue"></div> <!-- Value in circle -->
                  </div>
                </div>

              </ul>
            </div>
          </nav>

        <div class="rgbButtons">
          <button id="rgbButton1" class="rgbLight"></button>
          <button id="rgbButton2" class="rgbLight"></button>
          <button id="rgbButton3" class="rgbLight"></button>
        </div>
      </div>
          
        <div class="info" id="info2" style="visibility: hidden;">

          <span class="icon">ⓘ</span>

          <!-- expandable window -->
          <div class="info-window">
            <span class="extra-info" id="errors2"></span>
          </div>

        </div>
      

      </div>



</div>  <!-- end of container-->

<div id="settingsPage">
  <button id="settingsCloseBtn">✕</button>
  <h1 class="settingsTitle">Settings</h1>
  <div class="settingsContent">

    <div class="calibSection">
      <h2>Graph input calibration</h2>

      <div class="calibRow">
        <label for="mqttInputSelect">Input:</label>
        <select id="mqttInputSelect">
          <option value="">-- select --</option>
          <option value="0">A0 — Heater tank</option>
          <option value="1">A1 — Camper volt</option>
          <option value="2">A2 — Engine volt</option>
          <option value="3">A3 — Coolant temp</option>
        </select>
      </div>

      <div class="calibLive">
        <div>Live raw: <span id="liveRawValue">—</span></div>
        <div>Mapped:   <span id="liveMappedValue">—</span></div>
      </div>

      <div class="calibLayout">
        <div class="calibForm">
          <div class="calibRow" data-point="0">
            <label>Point A:</label>
            <input type="number" class="calibRaw"    placeholder="raw"    step="any">
            <span class="arrow">→</span>
            <input type="number" class="calibMapped" placeholder="mapped" step="any">
            <button class="useLiveBtn">use live</button>
          </div>
          <div class="calibRow" data-point="1">
            <label>Point B:</label>
            <input type="number" class="calibRaw"    placeholder="raw"    step="any">
            <span class="arrow">→</span>
            <input type="number" class="calibMapped" placeholder="mapped" step="any">
            <button class="useLiveBtn">use live</button>
          </div>
          <div class="calibRow hidden" data-point="2">
            <label>Point C:</label>
            <input type="number" class="calibRaw"    placeholder="raw"    step="any">
            <span class="arrow">→</span>
            <input type="number" class="calibMapped" placeholder="mapped" step="any">
            <button class="useLiveBtn">use live</button>
            <button class="removePointBtn" title="remove">×</button>
          </div>
          <div class="calibRow hidden" data-point="3">
            <label>Point D:</label>
            <input type="number" class="calibRaw"    placeholder="raw"    step="any">
            <span class="arrow">→</span>
            <input type="number" class="calibMapped" placeholder="mapped" step="any">
            <button class="useLiveBtn">use live</button>
            <button class="removePointBtn" title="remove">×</button>
          </div>
          <div class="calibRow hidden" data-point="4">
            <label>Point E:</label>
            <input type="number" class="calibRaw"    placeholder="raw"    step="any">
            <span class="arrow">→</span>
            <input type="number" class="calibMapped" placeholder="mapped" step="any">
            <button class="useLiveBtn">use live</button>
            <button class="removePointBtn" title="remove">×</button>
          </div>
          <button id="addPointBtn">+ Add point</button>
        </div>

        <div class="calibCurveBox">
          <canvas id="calibCurve"></canvas>
          <div class="calibSideSettings">
            <div class="rangeSettings">
              <div class="calibRow">
                <label>Name:</label>
                <input type="text" id="dispName" placeholder="display name">
              </div>
              <div class="calibRow">
                <label>Min value:</label>
                <input type="number" id="rangeMin" step="any">
              </div>
              <div class="calibRow">
                <label>Max value:</label>
                <input type="number" id="rangeMax" step="any">
              </div>
              <div class="calibRow">
                <label>Low → normal:</label>
                <input type="number" id="rangeLow" step="any">
              </div>
              <div class="calibRow">
                <label>Normal → high:</label>
                <input type="number" id="rangeHigh" step="any">
              </div>
              <div class="calibRow">
                <label>Filter (readings):</label>
                <input type="number" id="dispFilter" min="1" step="1" placeholder="1 = raw">
              </div>
            </div>

            <div class="displaySettings">
              <div class="calibRow">
                <label>Decimals:</label>
                <input type="number" id="dispDecimals" min="0" max="4" step="1">
              </div>
              <div class="calibRow">
                <label>Unit / suffix:</label>
                <input type="text" id="dispUnit" placeholder="%, V, °…">
              </div>
              <div class="calibRow">
                <label>Low color:</label>
                <input type="color" id="dispLowColor">
              </div>
              <div class="calibRow">
                <label>Normal color:</label>
                <input type="color" id="dispNormalColor">
              </div>
              <div class="calibRow">
                <label>High color:</label>
                <input type="color" id="dispHighColor">
              </div>
            </div>
          </div>
        </div>
      </div>

      <button id="saveCalibBtn">Save</button>
    </div>

  </div>
</div>


        <script src="window.js"></script>
  </body>
</html>
